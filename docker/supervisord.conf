[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:system-dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
priority=10
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:session-dbus]
command=/usr/bin/dbus-daemon --session --nofork --nopidfile --address=unix:path=/run/proaudio-player/session-bus
user=proaudio-player
priority=11
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:pipewire]
command=/usr/bin/pipewire
user=proaudio-player
priority=20
autostart=true
autorestart=true
startsecs=2
environment=HOME="/home/proaudio-player",XDG_STATE_HOME="/home/proaudio-player/.local/state",XDG_RUNTIME_DIR="/run/proaudio-player",PIPEWIRE_RUNTIME_DIR="/run/proaudio-player",DBUS_SESSION_BUS_ADDRESS="unix:path=/run/proaudio-player/session-bus"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:pipewire-pulse]
command=/usr/bin/pipewire-pulse
user=proaudio-player
priority=21
autostart=true
autorestart=true
startsecs=2
environment=HOME="/home/proaudio-player",XDG_RUNTIME_DIR="/run/proaudio-player",PIPEWIRE_RUNTIME_DIR="/run/proaudio-player",DBUS_SESSION_BUS_ADDRESS="unix:path=/run/proaudio-player/session-bus"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:wireplumber]
command=/usr/bin/wireplumber
user=proaudio-player
priority=22
autostart=true
autorestart=true
startsecs=2
environment=HOME="/home/proaudio-player",XDG_STATE_HOME="/home/proaudio-player/.local/state",XDG_RUNTIME_DIR="/run/proaudio-player",PIPEWIRE_RUNTIME_DIR="/run/proaudio-player",DBUS_SESSION_BUS_ADDRESS="unix:path=/run/proaudio-player/session-bus"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:audio-buses]
command=/usr/local/bin/run-audio-buses.sh
user=proaudio-player
priority=30
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
environment=HOME="/home/proaudio-player",XDG_RUNTIME_DIR="/run/proaudio-player",PULSE_SERVER="unix:/run/proaudio-player/pulse/native"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:audio-output-watch]
command=/usr/libexec/proaudio-player/proaudio-player-output-watch
user=proaudio-player
priority=31
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
environment=HOME="/home/proaudio-player",XDG_RUNTIME_DIR="/run/proaudio-player",PULSE_SERVER="unix:/run/proaudio-player/pulse/native",AUDIO_ENV="/run/proaudio-player/audio.env",OUTPUT_ENV="/var/lib/proaudio-player-alert/audio-output.env",BUS_SCRIPT="/usr/libexec/proaudio-player/audio-buses.sh"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:avahi]
command=/usr/sbin/avahi-daemon --no-chroot --no-drop-root
priority=32
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mpd]
command=/usr/local/bin/run-service.sh ENABLE_MPD audio /usr/bin/mpd --no-daemon /opt/proaudio-player/defaults/mpd.conf
user=proaudio-player
priority=40
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
environment=HOME="/home/proaudio-player",XDG_RUNTIME_DIR="/run/proaudio-player",PULSE_SERVER="unix:/run/proaudio-player/pulse/native",PULSE_SINK="proaudio_player_music"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:airplay]
command=/usr/local/bin/run-service.sh ENABLE_AIRPLAY audio /usr/bin/shairport-sync -c /opt/proaudio-player/defaults/shairport-sync.conf
user=proaudio-player
priority=41
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
environment=HOME="/home/proaudio-player",XDG_RUNTIME_DIR="/run/proaudio-player",PULSE_SERVER="unix:/run/proaudio-player/pulse/native",PULSE_SINK="proaudio_player_music"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dlna]
command=/usr/local/bin/run-service.sh ENABLE_DLNA audio /usr/local/bin/run-dlna.sh
user=proaudio-player
priority=42
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
environment=HOME="/home/proaudio-player",XDG_RUNTIME_DIR="/run/proaudio-player",PULSE_SERVER="unix:/run/proaudio-player/pulse/native",PULSE_SINK="proaudio_player_music"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:spotify]
command=/usr/local/bin/run-service.sh ENABLE_SPOTIFY audio /usr/local/bin/spotifyd --no-daemon --config-path /opt/proaudio-player/defaults/spotifyd.conf
user=proaudio-player
priority=43
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
environment=HOME="/home/proaudio-player",XDG_RUNTIME_DIR="/run/proaudio-player",PULSE_SERVER="unix:/run/proaudio-player/pulse/native",PULSE_SINK="proaudio_player_music"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:native]
command=/usr/local/bin/run-service.sh ALWAYS audio /usr/local/bin/proaudio-player-native --config /etc/proaudio-player-alert/config.yaml run
user=proaudio-player
priority=50
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
environment=HOME="/home/proaudio-player",XDG_RUNTIME_DIR="/run/proaudio-player",PULSE_SERVER="unix:/run/proaudio-player/pulse/native",PROAUDIO_WEBUI_DIR="/usr/share/proaudio-player/webui",PROAUDIO_AUDIO_ENV="/run/proaudio-player/audio.env"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
