<!DOCTYPE busconfig PUBLIC
          "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
          "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="proaudio-player">
    <allow own_prefix="rs.spotifyd"/>
    <allow own_prefix="org.mpris.MediaPlayer2.spotifyd"/>
    <allow send_destination_prefix="rs.spotifyd"/>
    <allow send_destination_prefix="org.mpris.MediaPlayer2.spotifyd"/>

    <allow own_prefix="org.mpris.MediaPlayer2.ShairportSync"/>
    <allow send_destination_prefix="org.mpris.MediaPlayer2.ShairportSync"/>

    <allow own_prefix="org.gnome.ShairportSync"/>
    <allow send_destination_prefix="org.gnome.ShairportSync"/>
  </policy>
</busconfig>
