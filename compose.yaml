services:
  proaudio-player:
    platform: "${DOCKER_PLATFORM:-linux/amd64}"
    build:
      context: .
      target: runtime
      args:
        APP_VERSION: "${APP_VERSION:-dev}"
        NATIVE_REVISION: "${NATIVE_REVISION:-unknown}"
        WEBUI_REVISION: "${WEBUI_REVISION:-unknown}"
        SPOTIFYD_VERSION: "${SPOTIFYD_VERSION:-0.4.2}"
    image: "proaudio-player-native:${IMAGE_TAG:-dev}"
    container_name: proaudio-player
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: "${TZ:-Europe/Kyiv}"
      AUDIO_MODE: "${AUDIO_MODE:-null}"
      ENABLE_AIRPLAY: "${ENABLE_AIRPLAY:-true}"
      ENABLE_MPD: "${ENABLE_MPD:-true}"
      ENABLE_SPOTIFY: "${ENABLE_SPOTIFY:-true}"
      PROAUDIO_WEBUI_DIR: /usr/share/proaudio-player/webui
      PROAUDIO_HTTP_PORT: "${PROAUDIO_HTTP_PORT:-5371}"
      HEALTHCHECK_HTTP: "${HEALTHCHECK_HTTP:-true}"
      HEALTHCHECK_PORT: "${HEALTHCHECK_PORT:-5371}"
    volumes:
      - ./docker-data/config:/etc/proaudio-player-alert
      - ./docker-data/data:/var/lib/proaudio-player-alert
      - ./docker-data/music:/srv/music
      - proaudio-runtime:/run/proaudio-player
    stop_grace_period: 20s

  dlna-worker:
    platform: "${DOCKER_PLATFORM:-linux/amd64}"
    build:
      context: .
      target: dlna-worker
    image: "proaudio-player-dlna-worker:${IMAGE_TAG:-dev}"
    container_name: proaudio-player-dlna-worker
    restart: unless-stopped
    depends_on:
      proaudio-player:
        condition: service_healthy
    environment:
      ENABLE_DLNA: "${ENABLE_DLNA:-true}"
      PULSE_SERVER: unix:/run/proaudio-player/pulse/native
      PULSE_SINK: proaudio_player_music
    volumes:
      - proaudio-runtime:/run/proaudio-player
    networks:
      dlna-private:
        ipv4_address: 169.254.253.1
    stop_grace_period: 10s

volumes:
  proaudio-runtime:

networks:
  dlna-private:
    driver: bridge
    ipam:
      config:
        - subnet: 169.254.253.0/29
          gateway: 169.254.253.6
