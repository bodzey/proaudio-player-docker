name: Docker CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: docker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Docker adapter
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.hardware.yaml config --quiet

      - name: Run repository-owned contract tests
        run: bash tests/contract.sh

      - name: Lint source synchronization
        run: shellcheck docker/proaudio-player-dockerctl tests/sync-sources.sh

      - name: Check portable single-container contract
        run: |
          test "$(docker compose config --services | wc -l)" -eq 1
          test "$(docker compose config --services)" = "proaudio-player"
          ! grep -RniE 'platform:[[:space:]].*amd64|--interface-name=eth0|PROAUDIO_LAN_INTERFACE|raspberry|bcm(27|28|43)|mmcblk|vc4'             Dockerfile compose.yaml docker

      - name: Build portable runtime from pinned sources
        run: |
          docker build \
            --build-arg SPOTIFYD_VERSION=0.4.2 \
            --build-arg SPOTIFYD_REVISION=c5b94367014856a8c541dea565cbd332e034fb9e \
            --build-arg NATIVE_REVISION="$(git -C sources/proaudio-player-native rev-parse HEAD)" \
            --build-arg WEBUI_REVISION="$(git -C sources/proaudio-player-webui rev-parse HEAD)" \
            --tag proaudio-player:ci \
            .

      - name: Verify installed native executable
        run: docker run --rm --entrypoint /usr/local/bin/proaudio-player-native proaudio-player:ci --version
