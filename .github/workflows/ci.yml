name: Docker CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Docker adapter
        uses: actions/checkout@v5

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.hardware.yaml config --quiet

      - name: Run repository-owned contract tests
        run: bash tests/contract.sh

      - name: Check portable single-container contract
        run: |
          test "$(docker compose config --services | wc -l)" -eq 1
          test "$(docker compose config --services)" = "proaudio-player"
          ! grep -RniE 'platform:[[:space:]].*amd64|--interface-name=eth0|PROAUDIO_LAN_INTERFACE|raspberry|bcm(27|28|43)|mmcblk|vc4'             Dockerfile compose.yaml docker

      - name: Build Spotify Connect discovery stage
        run: |
          docker build \
            --target spotifyd-builder \
            --build-arg SPOTIFYD_VERSION=0.4.2 \
            --build-arg SPOTIFYD_REVISION=c5b94367014856a8c541dea565cbd332e034fb9e \
            .
