name: Docker CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Docker adapter
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.hardware.yaml config --quiet

      - name: Run repository-owned tests
        run: python -m pytest -q -k "not expected_dev_source_assets_exist"

      - name: Check portable single-container contract
        run: |
          test "$(docker compose config --services | wc -l)" -eq 1
          test "$(docker compose config --services)" = "proaudio-player"
          ! grep -RniE 'platform:[[:space:]].*amd64|--interface-name=eth0|raspberry|bcm(27|28|43)|mmcblk|vc4'             Dockerfile compose.yaml docker
