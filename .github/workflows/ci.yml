name: Docker CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Docker adapter
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Run repository-owned tests
        run: >-
          python -m pytest -q
          -k "not dlna_worker_is_private_and_matches_native_endpoint
          and not expected_dev_source_assets_exist"
