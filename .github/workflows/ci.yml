name: Docker CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Docker adapter
        uses: actions/checkout@v5

      - name: Sync current dev sources
        run: |
          git submodule sync --recursive
          git submodule update --init --remote --checkout \
            sources/proaudio-player-native \
            sources/proaudio-player-webui
          git -C sources/proaudio-player-native rev-parse HEAD
          git -C sources/proaudio-player-webui rev-parse HEAD

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Run repository-owned tests
        run: python -m pytest -q
